```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Marks Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .info {
            text-align: center;
            margin-bottom: 25px;
            color: #555;
        }

        .form-box {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input {
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .add-btn {
            grid-column: 1 / 3;
            padding: 13px;
            font-size: 17px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }

        #message {
            text-align: center;
            margin: 15px 0;
            font-weight: bold;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            min-width: 1100px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #2563eb;
            color: white;
        }

        tr:nth-child(even) {
            background: #f8fafc;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .pass {
            color: green;
            font-weight: bold;
        }

        .fail {
            color: red;
            font-weight: bold;
        }

        .note {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #555;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>My Marks Calculator</h1>

        <div class="info">
            Enter your marks for all 5 subjects
        </div>

        <div class="form-box">

            <!-- Roll Number -->
            <input
                type="text"
                id="roll"
                placeholder="Roll Number (Example: 25B81A1266)"
            >

            <!-- Student Name -->
            <input
                type="text"
                id="name"
                placeholder="Student Name"
            >

            <!-- Subjects -->

            <input
                type="number"
                id="dmgt"
                placeholder="DMGT Marks"
                min="0"
            >

            <input
                type="number"
                id="ads"
                placeholder="ADS Marks"
                min="0"
            >

            <input
                type="number"
                id="uhv"
                placeholder="UHV Marks"
                min="0"
            >

            <input
                type="number"
                id="oopj"
                placeholder="OOPJ Marks"
                min="0"
            >

            <input
                type="number"
                id="dlco"
                placeholder="DL&CO Marks"
                min="0"
            >

            <button class="add-btn" onclick="calculateMarks()">
                Calculate My Marks
            </button>

        </div>

        <div id="message"></div>

        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>Roll Number</th>
                        <th>Name</th>
                        <th>DMGT</th>
                        <th>ADS</th>
                        <th>UHV</th>
                        <th>OOPJ</th>
                        <th>DL&CO</th>
                        <th>Total</th>
                        <th>Average</th>
                        <th>Result</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="marksTable">
                </tbody>

            </table>

        </div>

        <div class="note">
            Pass Mark: 16 marks in each subject
        </div>

    </div>


    <script>

        function calculateMarks() {

            // Get Roll Number and Name

            let roll =
                document.getElementById("roll").value.trim();

            let name =
                document.getElementById("name").value.trim();


            // Get marks

            let dmgtValue =
                document.getElementById("dmgt").value;

            let adsValue =
                document.getElementById("ads").value;

            let uhvValue =
                document.getElementById("uhv").value;

            let oopjValue =
                document.getElementById("oopj").value;

            let dlcoValue =
                document.getElementById("dlco").value;


            // Check empty fields

            if (
                roll === "" ||
                name === "" ||
                dmgtValue === "" ||
                adsValue === "" ||
                uhvValue === "" ||
                oopjValue === "" ||
                dlcoValue === ""
            ) {

                document.getElementById("message").innerText =
                    "Please enter all details.";

                document.getElementById("message").style.color =
                    "red";

                return;
            }


            // Convert marks into numbers

            let dmgt = Number(dmgtValue);
            let ads = Number(adsValue);
            let uhv = Number(uhvValue);
            let oopj = Number(oopjValue);
            let dlco = Number(dlcoValue);


            // Check marks

            if (
                dmgt < 0 || dmgt > 100 ||
                ads < 0 || ads > 100 ||
                uhv < 0 || uhv > 100 ||
                oopj < 0 || oopj > 100 ||
                dlco < 0 || dlco > 100
            ) {

                document.getElementById("message").innerText =
                    "Marks should be between 0 and 100.";

                document.getElementById("message").style.color =
                    "red";

                return;
            }


            // Calculate Total

            let total =
                dmgt +
                ads +
                uhv +
                oopj +
                dlco;


            // Calculate Average

            let average = total / 5;


            // Check PASS / FAIL

            let result;

            if (
                dmgt >= 16 &&
                ads >= 16 &&
                uhv >= 16 &&
                oopj >= 16 &&
                dlco >= 16
            ) {

                result = "PASS";

            } else {

                result = "FAIL";
            }


            // Add result to table

            let table =
                document.getElementById("marksTable");

            let row =
                table.insertRow();


            row.insertCell(0).innerText = roll;

            row.insertCell(1).innerText = name;

            row.insertCell(2).innerText = dmgt;

            row.insertCell(3).innerText = ads;

            row.insertCell(4).innerText = uhv;

            row.insertCell(5).innerText = oopj;

            row.insertCell(6).innerText = dlco;

            row.insertCell(7).innerText = total;

            row.insertCell(8).innerText =
                average.toFixed(2);


            // Result cell

            let resultCell =
                row.insertCell(9);

            resultCell.innerText = result;


            if (result === "PASS") {

                resultCell.className = "pass";

            } else {

                resultCell.className = "fail";
            }


            // Delete button

            let deleteCell =
                row.insertCell(10);

            let deleteButton =
                document.createElement("button");

            deleteButton.innerText = "Delete";

            deleteButton.className = "delete-btn";


            deleteButton.onclick = function () {

                row.remove();

            };


            deleteCell.appendChild(deleteButton);


            // Clear inputs

            document.getElementById("roll").value = "";

            document.getElementById("name").value = "";

            document.getElementById("dmgt").value = "";

            document.getElementById("ads").value = "";

            document.getElementById("uhv").value = "";

            document.getElementById("oopj").value = "";

            document.getElementById("dlco").value = "";


            // Success message

            document.getElementById("message").innerText =
                "Marks calculated successfully!";

            document.getElementById("message").style.color =
                "green";
        }

    </script>

</body>

</html>
